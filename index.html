  <h2>一次関数とは？</h2>
  <p>
    一次関数とは、<strong>xが増えるとyが一定の割合で増えたり減ったりする関数</strong>です。
    中学校・高校でとてもよく出てくる重要な単元です。
  </p>

  <div class="box">
    一次関数の基本の形：<br>
    <strong>y = ax + b</strong>
  </div>

  <ul>
    <li><strong>a</strong>：増え方（傾き）</li>
    <li><strong>b</strong>：y切片（xが0のときのy）</li>
  </ul>

  <h2>グラフの特徴</h2>
  <p>
    一次関数のグラフは、<strong>必ず直線</strong>になります。
  </p>

  <div class="box">
    ・a が正 → 右上がり<br>
    ・a が負 → 右下がり
  </div>

  <h2>例題</h2>
  <p>次の一次関数を考えてみましょう。</p>

  <div class="box">
    y = 2x + 1
  </div>

  <p>
    xが1増えると、yは<strong>2ずつ増える</strong>関数です。
  </p>
